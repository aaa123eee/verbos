# On every push to main: unit tests, build, browser tests, then publish dist/ to GitHub Pages.
# If any step fails, nothing is published and the live site stays as it was.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: # the feedback bot; it ends up in the page anyway, but not in git
          PUBLIC_TG_TOKEN: ${{ secrets.PUBLIC_TG_TOKEN }}
          PUBLIC_TG_CHAT: ${{ secrets.PUBLIC_TG_CHAT }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
